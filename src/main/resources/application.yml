spring:
  application:
    name: tdse-twitter-monolith
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH0_ISSUER_URI:https://YOUR-DOMAIN.auth0.com/}

app:
  security:
    audience: ${AUTH0_AUDIENCE:https://api.example.com/twitter}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

server:
  port: ${PORT:8080}
  error:
    include-message: always
